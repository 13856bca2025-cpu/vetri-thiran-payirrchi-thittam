<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        FitBuddy
        {% endblock %}
    </title>

    <meta
        name="description"
        content="FitBuddy AI personalized fitness plan generator"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/styles.css') }}"
    >

</head>

<body>

<header class="site-header">

    <a
        class="brand"
        href="/"
    >
        FitBuddy<span>AI</span>
    </a>

    <nav>

        <a href="/">
            Create plan
        </a>

        <a href="/view-all-users">
            Admin
        </a>

        <a href="/docs">
            API Docs
        </a>

    </nav>

</header>


<main class="container">

    {% if error %}

    <div class="alert error">
        {{ error }}
    </div>

    {% endif %}


    {% if message %}

    <div class="alert success">
        {{ message }}
    </div>

    {% endif %}


    {% block content %}
    {% endblock %}

</main>


<footer class="site-footer">

    FitBuddy · AI-assisted wellness planning · Not medical advice

</footer>

</body>

</html>
